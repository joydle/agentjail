name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new stable clippy lint can't break CI on its own; bump
  # deliberately (and fix what it finds) together with this line.
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Control plane + phantom proxy, as an ordinary user. None of these
  # spawn jails; the Postgres store tests run against the service below.
  test-unprivileged:
    name: test (ctl, phantom; unprivileged + Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AJ_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p agentjail-ctl -p agentjail-phantom

  # The engine and the server's end-to-end tests spawn real jails, so the
  # test binaries run as root (`sudo -E` as the cargo target runner) and
  # each one gets its own leaf cgroup (agentjail follows the cgroup v2
  # leaf rule; see crates/agentjail/tests/support/cgroup_leaf_runner.sh).
  test-privileged:
    name: test (core, server; root)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: Build tests
        run: cargo test -p agentjail -p agentjail-server --no-run
      - name: Test as root in a delegated cgroup
        env:
          # Fail the network tests if the host firewall can't be installed.
          AGENTJAIL_FIREWALL: nft
        run: |
          # A cgroup of our own directly under the root, with controllers
          # delegated to its children; this shell (and so cargo) moves
          # into its `supervisor` child, and the runner puts each test
          # binary in a sibling leaf.
          CG=/sys/fs/cgroup/agentjail-ci
          sudo mkdir -p "$CG/supervisor"
          echo "+memory +cpu +pids +io" | sudo tee "$CG/cgroup.subtree_control" >/dev/null
          echo $$ | sudo tee "$CG/supervisor/cgroup.procs" >/dev/null
          cargo test -p agentjail -p agentjail-server --no-fail-fast \
            --config "target.'cfg(target_os = \"linux\")'.runner = ['sudo', '-E', '$PWD/crates/agentjail/tests/support/cgroup_leaf_runner.sh']"

  sdk-node:
    name: sdk (node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/sdk-node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sdk-python:
    name: sdk (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and a current one.
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Dev dependencies come from uv.lock (--locked fails if it is stale).
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev --python "$(command -v python)"
      - run: uv run --no-sync pytest
